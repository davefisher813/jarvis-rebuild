px;max-width:230px}.hline{height:1px;background:#e8dfd6;margin:16px 0}.listbutton{width:100%;text-align:left;padding:13px 0;border-bottom:1px solid #eee5d9;border-radius:0}.dot{height:8px;width:8px;background:#c92b3a;border-radius:50%;display:inline-block;margin-right:5px}.empty{padding:44px 10px;text-align:center}.empty .symbol{font-size:40px;margin-bottom:15px}.banner{padding:12px 14px;border-radius:16px;background:#fff0cd;margin:12px 0;font-size:13px;line-height:1.5}.skeleton{height:100px;border-radius:20px;background:linear-gradient(90deg,#eee6dc,#faf4eb,#eee6dc);background-size:200% 100%;animation:shimmer 2s infinite;margin:15px 0}@keyframes shimmer{to{background-position:-200% 0}}.veil{position:absolute;inset:0;background:#20283d55;z-index:5;display:flex;align-items:flex-end}.sheet{max-height:91%;overflow-y:auto;background:#fff8ef;width:100%;border-radius:30px 30px 0 0;padding:12px 22px 30px;box-shadow:0 -12px 35px #20283d10}.handle{width:38px;height:4px;background:#c8bbac;border-radius:4px;margin:0 auto 10px}.sheettitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheettitle h2{font-size:23px}.field{display:block;font-size:13px;font-weight:650;margin:14px 0 0}.field input,.field textarea,.field select,select.control{display:block;border:1px solid #dfd4c7;background:white;border-radius:14px;width:100%;padding:12px;margin-top:6px;color:#20283d}.field textarea{min-height:125px;resize:vertical}.field input[type=checkbox]{width:20px;height:20px;display:inline-block;vertical-align:middle;margin-right:9px}.scopeitem{padding:12px 0;border-bottom:1px solid #e8dfd6;display:flex;gap:10px;align-items:center}.scopeitem input{width:20px;height:20px}.toast{position:absolute;z-index:8;left:15px;right:15px;bottom:83px;border-radius:18px;background:#20283d;color:white;padding:14px 17px;font-size:14px;box-shadow:0 8px 20px #20283d33;display:flex;align-items:center;gap:8px}.toast button{color:#ffdda2;margin-left:auto}.meta{font-size:12px;colo </style></head><body>
<div class="stage"><aside class="intro"><div class="eyebrow">JARVIS / Unified v1</div><h1>Your context.<br>Your call.</h1><p>One shared foundation.<br>Email is the first surface.</p><div class="preview-control"><label for="scenario">Preview scenario</label><select id="scenario" class="control"><option value="normal">Everyday use</option><option value="empty">Empty</option><option value="loading">Loading</option><option value="error">Connection error</option><option value="offline">Offline</option><option value="reauth">Gmail needs reconnecting</option><option value="stale">Source changed</option><option value="unknown">Send outcome unknown</option><option value="unavailable">Money not ready</option><option value="admin">AI disabled by admin</option></select><div class="routegrid"><button data-route="today">Today</button><button data-route="email">Inbox</button><button data-route="waiting">Waiting</button><button data-route="agents">Agents</button><button data-route="review">Review</button><button data-route="activity">Activity</button><button data-do="compose">Compose</button><button data-do="history">Decision history</button></div><button class="secondary full" data-do="reset">Reset demo</button><p class="state-note">Interactive fixture data. No real mail is sent or connected.</p></div><p class="small">Start in Email, save a bill, then inspect its receipt in Activity. Or open AI Hub and review what an assistant can see.</p></aside>
<div class="phone"><div class="statusbar"><span>9:41</span><div class="island"></div><span>▮▮▮ &nbsp; ▰</span></div><main id="app" class="app"></main><nav class="nav" aria-label="App navigation"><button data-route="today"><span>◷</span>Today</button><button data-route="life"><span>▦</span>Life</button><button data-route="schedule"><span>▣</span>Schedule</button><button data-route="agents"><span>✳</span>AI Hub</button><button data-route="email"><span>✉</span>Email</button></nav><div id="overlay"></div><div id="toast" role="status" aria-live="polite"></div></div></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), app=$('#app'), overlay=$('#overlay');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mails=[
{id:'bill',sender:'Con Edison',initials:'CE',subject:'Your October bill is ready',snippet:'Your statement is ready to view.',time:'9:24',color:'green',kind:'bill',title:'Save bill to Money',value:'$142.30',detail:'Due Oct 15 · Con Edison',action:'Save bill',done:'Saved $142.30 bill → Money',body:'Your October statement is ready.\n\nAmount due: USD 142.30\nDue date: October 15, 2026\n\nThank you for being a customer.'},
{id:'waiting',sender:'Coach Miller',initials:'CM',subject:'Re: Peña transcript',snippet:'I’ll get the transcript over to you.',time:'9:08',color:'amber',kind:'waiting',title:'Track what you’re waiting for',value:'Peña transcript',detail:'From Coach Miller',action:'Track this',done:'Tracked Peña transcript',body:'Dave,\n\nI’ll get Peña’s transcript over to you once the school sends it to me.\n\nCoach Miller'},
{id:'wei',sender:'Wei Chang',initials:'WC',subject:'September expense summary',snippet:'The updated summary is attached.',time:'8:52',color:'blue',body:'Dave,\n\nThe updated September expense summary is attached for your review.\n\nWei'},
{id:'receipt',sender:'Delta Air Lines',initials:'DL',subject:'Your payment receipt',snippet:'Thanks for choosing Delta.',time:'8:35',color:'green',kind:'receipt',title:'Save receipt to Money',value:'$284.10',detail:'Delta · Paid Oct 2',action:'Save receipt',done:'Saved $284.10 receipt → Money',body:'Payment receipt\n\nTotal paid: USD 284.10\nPurchase date: October 2, 2026\n\nThis is your payment receipt, not your travel itinerary.'},
{id:'event',sender:'Mrs. Rodriguez',initials:'MR',subject:'Quick call about the deposit?',snippet:'October 4 at 10 AM Eastern works for me.',time:'8:12',color:'blue',kind:'event',title:'Add to schedule',value:'Call about deposit',detail:'Tomorrow · 10–10:15 AM Eastern',action:'Add to schedule',done:'Added deposit call → Schedule',body:'Hi Dave,\n\nCould we have a quick call about the deposit on October 4 at 10 AM Eastern? Fifteen minutes should be enough.\n\nThank you!'},
{id:'promo',sender:'Dick’s Sporting Goods',initials:'DS',subject:'A fresh start for your season',snippet:'Explore this week’s gear.',time:'7:48',color:'amber',body:'Explore this week’s gear and team equipment. No action is required.'}
];
let state,route='email',scenario='normal',tab='Decided',cat='All',filter='All',query='',mailbox='Inbox',waitingTab='Open',selectedAgent='Claude',timer,focusBack,approvedDraft=null;
function reset(){clearTimeout(timer);$('#toast').innerHTML='';app.scrollTop=0;state={saved:{},dismissed:{},waitingResolved:false,ai:true,revoked:{},mode:{Claude:'Help me',ChatGPT:'Read only'},decisions:[],notes:[],activity:[],drafts:[],sent:[],mentioned:false,categoryRemembered:false,selectedAccount:'dave@example.test',manual:[],decisionStatus:'Active',decisionTitle:'Keep summer travel under $8,000',decisionReason:'Prioritize driveable events so more of the budget reaches the athletes.',decisionVersions:[],importedText:''};route='email';scenario='normal';$('#scenario').value='normal';query='';cat='All';mailbox='Inbox';close();render()}
const count=()=>mails.filter(m=>m.kind&&!state.saved[m.id]&&!state.dismissed[m.id]).length+state.manual.filter(m=>!state.saved[m.id]).length;
function toast(msg,undo){clearTimeout(timer);$('#toast').innerHTML=`<div class="toast">${esc(msg)}${undo?'<button data-do="undo-last">Undo</button>':''}</div>`;timer=setTimeout(()=>$('#toast').innerHTML='',5000)}
function log(text,kind='action',extra={}){state.activity.unshift({id:Date.now()+Math.random(),text,kind,time:'Just now',...extra})}
function shell(title,sub,extra=''){return `<div class="top"><div><div class="brand">JARVIS</div><h1>${title}</h1></div>${extra}</div><div class="sub">${sub}</div>`}
function hubtabs(){return `<div class="tabs">${['agents','review','activity'].map(x=>`<button data-route="${x}" class="${route===x?'active':''}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>`}
function emailtabs(){return `<div class="tabs"><button data-route="email" class="${route==='email'?'active':''}">Inbox</button><button data-route="waiting" class="${route==='waiting'?'active':''}">Waiting${state.saved.waiting&&!state.waitingResolved?' · 1':''}</button></div>`}
function empty(title,desc,action){return `<div class="empty"><div class="symbol">✳</div><h2>${title}</h2><p class="sub">${desc}</p>${action||''}</div>`}
function banner(){return scenario==='offline'?'<div class="banner">Offline · Showing saved data<br>Connect to save or send.</div>':scenario==='reauth'?'<div class="banner">Gmail needs reconnecting. Saved mail is still here.<button data-do="reconnect" class="textbtn">Reconnect Gmail</button></div>':scenario==='admin'?'<div class="banner">AI is turned off by admin. Your manual tools still work.</div>':''}
function blocked(){if(scenario==='offline'||scenario==='reauth'){toast(scenario==='offline'?'Connect to save. Your details are still here.':'Reconnect Gmail to continue.');return true}return false}
function render(){let html='';if(['agents','review','activity'].includes(route)){html=shell('AI Hub','Your assistants. Your boundaries.',`<button data-do="toggle-ai" class="toggle ${!state.ai?'off':''}">${state.ai&&scenario!=='admin'?'AI on':'AI off'}</button>`)+hubtabs()}else if(['email','waiting'].includes(route)){html=shell('Email','A little less inbox. A little more life.',`<button class="circle" data-do="compose" aria-label="Compose email">+</button>`)+`<button class="textbtn tiny" data-do="accounts">${esc(state.selectedAccount)} · Updated 9:41 ↗</button>`+emailtabs()}
html+=banner();if(scenario==='loading'){html+='<div role="status" aria-label="Loading"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div><button data-do="recover" class="secondary full">Finish loading preview</button>';app.innerHTML=html;nav();return}if(scenario==='error'){html+=empty('Couldn’t refresh','Your saved data is safe. Try again when you’re ready.','<button class="primary full" data-do="recover">Retry</button>');app.innerHTML=html;nav();return}
if(route==='email') html+=inbox();else if(route==='waiting')html+=waiting();else if(route==='agents')html+=agents();else if(route==='review')html+=review();else if(route==='activity')html+=activity();else if(route==='today')html+=today();else if(route==='life')html+=life();else if(route==='schedule')html+=schedule();app.innerHTML=html;nav()}
function nav(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.route===route||(['review','activity'].includes(route)&&b.dataset.route==='agents')||(route==='waiting'&&b.dataset.route==='email')))}
function inbox(){let html=`<input id="search" class="search" type="search" placeholder="Search your mail" aria-label="Search your mail" value="${esc(query)}"><div class="between"><div class="chips">${['All','Money','Travel','Work','Personal'].map(c=>`<button data-cat="${c}" class="chip ${c===cat?'active':''}">${c}</button>`).join('')}</div><button data-do="refresh" class="tiny" aria-label="Refresh inbox">↻</button></div><div class="between"><span class="sectionlabel" style="margin:0">${query?'SEARCH RESULTS':'TODAY · OCT 3'}</span><button data-do="mailboxes" class="textbtn tiny">${mailbox}⌄</button></div>`;
if(scenario==='empty')return html+empty('You’re caught up','No mail in this inbox.');if(mailbox==='Drafts')return html+(state.drafts.length?state.drafts.map((d,i)=>`<button class="card full" data-draft="${i}" style="text-align:left">${esc(d.subject||'Untitled draft')}<p class="sub">${esc(d.to)} · JARVIS draft</p></button>`).join(''):empty('No saved drafts','Write a message whenever you’re ready.'));if(mailbox==='Sent')return html+(state.sent.length?state.sent.map(d=>`<div class="card"><h3>${esc(d.subject)}</h3><p class="sub">To ${esc(d.to)}</p><span class="badge green">Accepted by provider</span></div>`).join(''):empty('No messages sent from JARVIS yet','Sent means the provider accepted your message.'));
let list=mails.filter(m=>(!query||(m.sender+' '+m.subject+' '+m.body).toLowerCase().includes(query.toLowerCase()))&&(cat==='All'||(cat==='Money'&&['bill','receipt'].includes(m.kind))||(cat==='Work'&&['wei','waiting'].includes(m.id))||(cat==='Personal'&&m.id==='event')||(cat==='Travel'&&m.id==='receipt')));
if(!list.length)return html+empty('No matching mail','Try a different search or category.');html+=list.map(m=>`<article class="mail"><button class="mailmain" data-mail="${m.id}"><span class="avatar ${m.color}">${m.initials}</span><span class="grow"><strong>${m.sender}</strong><span class="subject">${m.subject}</span><span class="snippet">${m.snippet}</span></span><span class="time">${m.time}</span></button>${m.kind?card(m):''}</article>`).join('');html+=state.manual.map(card).join('');html+='<button data-do="grouping" class="textbtn full tiny">Remember a category preference</button>';html+='<button data-do="dismissed" class="textbtn full tiny">Show dismissed suggestions</button>';return html}
function card(m){if(state.saved[m.id])return `<div class="receiptline">✓ ${esc(m.done)}<button data-receipt="${m.id}">View</button></div>`;if(state.dismissed[m.id])return '';return `<div class="suggestion ${m.kind}"><div class="between"><span class="badge">${m.kind==='waiting'?'WAITING ON':m.kind==='event'?'SCHEDULE':m.kind==='task'?'TASKS':'MONEY'}</span><button data-dismiss="${m.id}" aria-label="Dismiss ${esc(m.title)}" class="tiny">×</button></div><p class="sub">${m.title}</p><div class="${['bill','receipt'].includes(m.kind)?'money':''}"><h3>${m.value}</h3></div><p class="sub">${m.detail}</p><div class="actions"><button class="primary" data-save="${m.id}">${m.action}</button><button data-detail="${m.id}" class="tiny">Details</button></div></div>`}
function agents(){if(scenario==='empty')return empty('No assistant connected','JARVIS still works. Start with a project, then share only what helps.','<button data-do="connect" class="primary full">Add assistant</button>');return `<div class="hero"><span class="badge">BUILT AROUND YOU</span><h2>Your life stays<br>with you.</h2><p>Share a project. Get help.<br>Keep the final say.</p></div>${['Claude','ChatGPT'].map((a,i)=>`<button class="card full" data-agent="${a}" style="text-align:left;margin-top:0"><div class="row"><span class="avatar ${i?'green':''}" style="width:48px;height:48px;font-size:22px">${i?'✳':'✺'}</span><div class="grow"><h3>${a}</h3><span class="sub">${state.revoked[a]?'Access revoked':state.mode[a]+' · Summer travel'}</span></div><span>›</span></div><div class="actions"><span class="badge ${state.revoked[a]?'':'green'}">${state.revoked[a]?'Disconnected':'Demo connection'}</span><span class="meta">1 project</span></div></button>`).join('')}<button class="secondary full" data-do="connect">+ Add assistant</button><p class="sub" style="margin:15px 5px">AI off? Every core JARVIS tool still works.</p>`}

case'toggle-ai':if(scenario==='admin'){toast('Turned off by admin.');break}state.ai=!state.ai;log(state.ai?'Turned AI on':'Turned AI off');render();toast(state.ai?'AI connections enabled within their scopes.':'AI off. Your manual tools still work.');break;

case'share-context':{if(blocked())break;const n=[0,1,2].filter(i=>$('#scope'+i)?.checked).length;if(!n){toast('Select at least one record.');break}log('Read '+n+' records in Summer travel','read',{actor:selectedAgent});close();render();toast('Shared '+n+' selected records. Receipt saved.');break}
case'export-context':{const chosen=[0,1,2].filter(i=>$('#scope'+i)?.checked);if(!chosen.length){toast('Select at least one record.');break}let data={protocol_version:1,project:'Summer travel',purpose:'Plan tournament budget',records:chosen.map(i=>[{title:'Project brief',summary:'Plan driveable tournament travel'},{title:'Travel budget',statement:'Keep travel under $8,000',status:'committed'},{title:'Roster task',status:'open'}][i]),expires_in_minutes:15,notice:'Exported copies cannot be recalled'};let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let link=document.createElement('a');link.href=url;link.download='jarvis-selected-context.json';link.click();URL.revokeObjectURL(url);log('Exported '+chosen.length+' selected context records','read');toast('Selected context exported.');break}
case'revoke':state.revoked[selectedAgent]=true;log('Revoked '+selectedAgent+' access');close();render();toast('Future access revoked. Previously shared copies cannot be recalled.');break;
case'connect':sheet('Bring your assistant',`<p>Your subscription stays with your AI. JARVIS shares only the context you choose.</p><div class="card"><h3>Manual context exchange</h3><p class="sub">Export a project and review imported suggestions. Available with any assistant.</p><button class="primary full" data-do="context">Choose context</button></div><div class="card"><h3>Live connections</h3><p class="sub">Claude, ChatGPT and other adapters appear here only when verified for your account.</p><span class="badge amber">Not connected in this preview</span></div>`);break;
case'save-decision':if(blocked())break;if($('#decision-title')){if(!$('#decision-title').value.trim()||!$('#decision-reason').value.trim()){toast('Add a statement and reason.');break}state.decisionTitle=$('#decision-title').value;state.decisionReason=$('#decision-reason').value}state.decisions.push(state.decisionTitle);log('Saved summer travel budget decision');close();render();toast('Decision saved. Reason and dependencies preserved.');break;
case'move-mentioned':state.mentioned=true;tab='Mentioned';render();break;
case'promote':if(state.importedText)state.decisionTitle=state.importedText;state.mentioned=false;tab='Decided';render();toast('Moved to Decided. Still not committed.');break;
case'keep-note':state.notes.push(state.mentioned?(state.importedText||state.decisionTitle):'Explore a second summer team');log('Saved exploration note');toast('Saved as a note, not an active decision.');break;
case'edit-decision':sheet('Decision details',`<label class="field">Statement<input id="decision-title" value="${esc(state.decisionTitle)}"></label><label class="field">Reason<textarea id="decision-reason">${esc(state.decisionReason)}</textarea></label><label class="field">Depends on<select><option>Final roster</option></select></label><p class="sub">Project: Summer travel</p><button class="primary full" data-do="save-decision">Save decision</button>`);break;
case'history':history();break;
case'replace-decision':sheet('Replace decision',`<div class="card"><span class="badge">CURRENT</span><p>Keep summer travel under $8,000</p></div><label class="field">New statement<input id="replacement" value="Keep summer travel under $9,000"></label><label class="field">Reason<textarea id="replacement-reason">Roster expanded to 12 athletes.</textarea></label><button class="primary full" data-do="commit-replacement">Replace decision</button>`);break;
case'commit-replacement':if(blocked())break;if(!$('#replacement').value.trim()||!$('#replacement-reason').value.trim()){toast('Add a statement and reason.');break}state.decisionVersions.push({title:state.decisionTitle,reason:state.decisionReason});state.decisionTitle=$('#replacement').value;state.decisionReason=$('#replacement-reason').value;state.decisionStatus='Active';if(!state.decisions.length)state.decisions.push(state.decisionTitle);log('Replaced summer travel budget decision');sheet('Decision replaced',`<span class="badge green">New version saved</span><h2>${esc(state.decisionTitle)}</h2><p>Version 1 remains in history as superseded. Dependent decisions need review.</p>`);break;
case'withdraw':sheet('Withdraw this decision?',`<p>Its history stays. It will no longer guide new plans. Related tasks and events stay unchanged.</p><label class="field">Reason<textarea id="withdraw-reason" placeholder="Why are you withdrawing it?"></textarea></label><button class="primary full" data-do="confirm-withdraw">Withdraw decision</button>`);break;
case'confirm-withdraw':if(!$('#withdraw-reason').value.trim()){toast('Add a reason.');break}if(blocked())break;state.decisionStatus='Withdrawn';log('Withdrew summer travel budget decision');close();render();toast('Decision withdrawn. History preserved.');break;
case'import':sheet('Save a conversation',`<p>Paste only the project discussion you want to keep.</p><label class="field">Conversation<textarea id="import-text" placeholder="Paste your discussion here…"></textarea></label><p class="sub">Pasted text starts in Mentioned. You choose what becomes a decision.</p><button class="primary full" data-do="import-save">Add to Mentioned</button>`);break;
case'import-save':if(!$('#import-text').value.trim()){toast('Paste a conversation first.');break}state.importedText=$('#import-text').value;state.mentioned=true;tab='Mentioned';close();render();toast('Added to Mentioned. Nothing committed.');break;
case'project':sheet('Choose a project',`<button class="secondary full" data-do="close">Summer travel · Selected</button><p class="sub">Context is scoped to this project, not your entire life.</p>`);break;
case'resolve':if(blocked())break;state.waitingResolved=!state.waitingResolved;waitingTab=state.waitingResolved?'Resolved':'Open';log((state.waitingResolved?'Resolved':'Reopened')+' Peña transcript');render();toast(state.waitingResolved?'Resolved. No message sent.':'Waiting item reopened.');break;
case'follow-date':sheet('When should this return?',`<label class="field">Follow-up date<input type="date" id="follow-date" value="2026-10-06"></label><p class="sub">This updates Waiting only. It does not create a task or event.</p><button class="primary full" data-do="save-follow-date">Save follow-up date</button>`);break;
case'save-follow-date':if(blocked())break;state.followDate=$('#follow-date').value;close();render();toast('Follow-up date saved.');break;
case'follow-up':compose({to:'coach@example.test',subject:'Re: Peña transcript',body:'Hi Coach, checking in on Peña’s transcript. Could you send it over when you have it?\n\nThanks,\nDave'});break;
case'accounts':sheet('Your mail accounts',`<div class="card"><h3>dave@example.test</h3><p class="sub">Demo Gmail · Last updated 9:41</p><button class="textbtn" data-do="reconnect">Reconnect Gmail</button></div><p class="sub">Live OAuth is not connected in this preview. Approved life records remain if you disconnect.</p><button class="secondary full" data-do="disconnect-account">Disconnect Gmail</button>`);break;
case'disconnect-account':scenario='reauth';$('#scenario').value='reauth';close();render();toast('Demo account disconnected. Confirmed records kept.');break;
case'mailboxes':sheet('Mailboxes',`${['Inbox','Drafts','Sent'].map(m=>`<button class="secondary full" data-box="${m}">${m}</button>`).join('')}`);break;
case'grouping':sheet('Use this category next time?',`<span class="badge purple">SUGGESTED FROM YOUR TAPS</span><h2>Coach Miller → Work</h2><p>You categorized this sender three times. Remember it for local category tags?</p><p class="sub">Mail stays visible in the chronological inbox. Nothing is archived, hidden or sent.</p><button class="primary full" data-do="remember-group">Remember</button><button class="textbtn full" data-do="close">Not now</button>`);break;case'remember-group':state.categoryRemembered=true;log('Saved local Work category preference');close();render();toast('Preference saved. All mail remains visible.');break;case'dismissed':sheet('Dismissed suggestions',Object.keys(state.dismissed).length?Object.keys(state.dismissed).map(id=>`<button class="secondary full" data-restore="${id}">Restore ${esc(find(id).title)}</button>`).join(''):'<p>No dismissed suggestions.</p>');break;
case'undo-last':if(state.lastSaved){delete state.saved[state.lastSaved];log('Undid '+find(state.lastSaved).action.toLowerCase());render();toast('Save reversed. Suggestion restored.')}break;
case'provider':sheet('Open in Gmail',`<p>This preview has no real Gmail thread connection.</p><p class="sub">In the app, Open in Gmail uses a verified account and thread link. If only a generic link is available, it says Open Gmail.</p><button class="secondary full" data-do="close">Back to preview</button>`);break;
case'mark-unread':case'archive':case'trash':if(blocked())break;log({ 'mark-unread':'Marked email unread',archive:'Archived email',trash:'Moved email to trash'}[a]);close();toast('Preview action recorded. No real Gmail changes.');render();break;
case'attachment':sheet('Attachment',`<h3>September-expenses.pdf</h3><p>240 KB · PDF</p><p class="sub">A real attachment opens through an authorized download. Preview fixture only.</p><button class="secondary full" data-do="provider">Open in Gmail</button>`);break;
case'ccbcc':$('#extra-recipients').classList.remove('hidden');break;
case'attach-draft':toast('Preview: attachment upload belongs to the provider integration.');break;
case'save-draft':currentDraft=draftValues();state.drafts.push({...currentDraft});log('Saved reply draft','draft');close();render();toast('Draft saved in preview. Nothing sent.');break;
case'review-send':reviewSend();break;
case'edit-send':compose(currentDraft);break;
case'send':if(blocked())break;if(approvedDraft!==JSON.stringify(currentDraft)){toast('Message changed. Review again.');break}approvedDraft=null;if(scenario==='unknown'){log('Send status unknown','action');sheet('Send status unknown',`<span class="badge amber">OUTCOME UNKNOWN</span><h2>Check Gmail before trying again.</h2><p>We couldn’t confirm whether the provider accepted your message.</p><p class="sub">No automatic resend will occur. This attempt stays blocked until it can be reconciled.</p><button class="primary full" data-do="provider">Open in Gmail</button><button class="secondary full" disabled>Resend unavailable</button>`)}else{state.sent.push({...currentDraft});log('Sent reply to '+currentDraft.to);sheet('Message sent',`<span class="badge green">DEMO PROVIDER ACKNOWLEDGEMENT</span><h2>Sent to ${esc(currentDraft.to)}</h2><p class="sub">Exact reviewed message · ${esc(currentDraft.account)}</p><div class="card"><p>Provider accepted the message.</p><p class="sub">This does not mean it was delivered or read. No real mail is sent by this prototype.</p></div><button class="primary full" data-route="activity">View Activity</button>`)}break;
case'copy-receipt':navigator.clipboard?.writeText(overlay.innerText).then(()=>toast('Receipt copied.')).catch(()=>toast('Select the receipt text to copy.'));break;
case'existing-task':sheet('Review scholarship applications','<span class="badge">EXISTING TODAY TASK</span><p>This represents an existing committed task. The Email slice does not replace your Today page.</p>');break;
}
});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.box){mailbox=b.dataset.box;close();render()}if(b?.dataset.restore){delete state.dismissed[b.dataset.restore];close();render();toast('Suggestion restored.')}});
reset();window.jarvisPreview={getState:()=>structuredClone(state),getRoute:()=>route};
})();
</script></body></html>
