# Cloud iOS builds for JARVIS (no Mac needed): connect this repo at
# codemagic.io, add the Apple Developer integration + App Store Connect API
# key in the Codemagic UI, and this workflow builds a signed .ipa and pushes
# it to TestFlight on demand.
workflows:
  ios-testflight:
    name: JARVIS iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials # set up in Codemagic UI: App Store Connect API key
      vars:
        BUNDLE_ID: com.bridge.jarvis
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        VITE_API_BASE: https://jarvis-rebuild.vercel.app
      node: 20
      xcode: latest
      cocoapods: default
    working_directory: jarvis-app
    integrations:
      app_store_connect: JARVIS # name your API key integration this in the UI
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web bundle for the native shell
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build signed ipa
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - jarvis-app/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
